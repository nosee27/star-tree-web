﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星树 - 我的星球</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/myplanets.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="top-nav">
        <div class="nav-container">
            <button class="back-btn" onclick="goBack()">← 返回</button>
            <div class="logo">
                <span class="logo-icon">🪐</span>
                <span class="logo-text">我的星球</span>
            </div>
            <span class="nav-placeholder"></span>
        </div>
    </header>

    <!-- 统计信息 -->
    <div class="stats-section">
        <div class="stat-item">
            <span class="stat-value">8</span>
            <span class="stat-label">拥有星球</span>
        </div>
        <div class="stat-item">
            <span class="stat-value">12</span>
            <span class="stat-label">探索星球</span>
        </div>
        <div class="stat-item">
            <span class="stat-value">5</span>
            <span class="stat-label">邀请领取</span>
        </div>
    </div>

    <!-- 我的星球列表 -->
    <div class="planets-section">
        <h3 class="section-title">🪐 我的星球</h3>
        <div class="planets-grid" id="planetsGrid">
            <!-- 星球将动态生成 -->
        </div>
    </div>

    <!-- 探索记录 -->
    <div class="explore-section">
        <h3 class="section-title">🚀 探索记录</h3>
        <div class="explore-list" id="exploreList">
            <!-- 探索记录将动态生成 -->
        </div>
    </div>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
        <div class="nav-item" onclick="redirectToIndex()">
            <span class="nav-icon">🏠</span>
            <span class="nav-text">首页</span>
        </div>
        <div class="nav-item" onclick="redirectToMatch()">
            <span class="nav-icon">🤝</span>
            <span class="nav-text">契约匹配</span>
        </div>
        <div class="nav-item" onclick="redirectToGarden()">
            <span class="nav-icon">🌻</span>
            <span class="nav-text">情绪花园</span>
        </div>
        <div class="nav-item" onclick="redirectToTreehole()">
            <span class="nav-icon">🌳</span>
            <span class="nav-text">树洞倾诉</span>
        </div>
        <div class="nav-item" onclick="redirectToProfile()">
            <span class="nav-icon">👤</span>
            <span class="nav-text">我的</span>
        </div>
    </nav>

    <script src="js/myplanets.js"></script>
</body>
</html>
