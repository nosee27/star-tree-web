<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星树 - 情绪花园</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/garden.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="top-nav">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">⭐</span>
                <span class="logo-text">星树</span>
            </div>
            <div class="slogan">
                <span>Lose yourself to find yourself.</span>
            </div>
        </div>
    </header>

    <!-- 花园统计 -->
    <div class="garden-stats">
        <div class="stat-card">
            <span class="stat-icon">🌱</span>
            <span class="stat-value">23</span>
            <span class="stat-label">植物总数</span>
        </div>
        <div class="stat-card">
            <span class="stat-icon">💧</span>
            <span class="stat-value">7</span>
            <span class="stat-label">连续登录</span>
        </div>
        <div class="stat-card">
            <span class="stat-icon">🌸</span>
            <span class="stat-value">8</span>
            <span class="stat-label">开花植物</span>
        </div>
        <div class="stat-card">
            <span class="stat-icon">🌳</span>
            <span class="stat-value">2</span>
            <span class="stat-label">友谊树</span>
        </div>
    </div>

    <!-- 花园区域 -->
    <main class="garden-content">
        <div class="garden-header">
            <h3>我的花园</h3>
            <button class="water-btn" onclick="waterAllPlants()">💧 浇水</button>
        </div>
        
        <div class="garden-grid" id="gardenGrid">
            <!-- 植物卡片将动态生成 -->
        </div>
    </main>

    <!-- 植物详情弹窗 -->
    <div id="plantModal" class="modal" style="display: none;">
        <div class="modal-content plant-content">
            <div class="plant-header">
                <span class="plant-emoji" id="plantEmoji">🌱</span>
                <div class="plant-info">
                    <h3 id="plantName">植物名称</h3>
                    <span class="plant-type" id="plantType">类型</span>
                </div>
            </div>
            <div class="plant-body">
                <div class="plant-stats">
                    <div class="stat-row">
                        <span>成长度</span>
                        <div class="progress-bar">
                            <div class="progress-fill" id="growthProgress" style="width: 60%;"></div>
                        </div>
                        <span id="growthPercent">60%</span>
                    </div>
                    <div class="stat-row">
                        <span>浇水次数</span>
                        <span id="waterCount">12次</span>
                    </div>
                    <div class="stat-row">
                        <span>种植时间</span>
                        <span id="plantDate">2024-01-15</span>
                    </div>
                </div>
                <p class="plant-story" id="plantStory">这株植物的故事...</p>
            </div>
            <div class="plant-footer">
                <button class="btn btn-secondary" onclick="closePlantModal()">关闭</button>
                <button class="btn btn-primary" onclick="waterPlant()">浇水</button>
            </div>
        </div>
    </div>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
        <div class="nav-item" onclick="redirectToIndex()">
            <span class="nav-icon">🏠</span>
            <span class="nav-text">首页</span>
        </div>
        <div class="nav-item" onclick="redirectToMatch()">
            <span class="nav-icon">🤝</span>
            <span class="nav-text">契约匹配</span>
        </div>
        <div class="nav-item active" onclick="redirectToGarden()">
            <span class="nav-icon">🌻</span>
            <span class="nav-text">情绪花园</span>
        </div>
        <div class="nav-item" onclick="redirectToTreehole()">
            <span class="nav-icon">🌳</span>
            <span class="nav-text">树洞倾诉</span>
        </div>
        <div class="nav-item" onclick="redirectToProfile()">
            <span class="nav-icon">👤</span>
            <span class="nav-text">我的</span>
        </div>
    </nav>

    <script src="js/garden.js"></script>
</body>
</html>
