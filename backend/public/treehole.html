﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星树 - 树洞</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/treehole.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="top-nav">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">⭐</span>
                <span class="logo-text">星树</span>
            </div>
            <div class="slogan">
                <span>Lose yourself to find yourself.</span>
            </div>
        </div>
    </header>

    <!-- 主要内容区 -->
    <main class="main-content">
        <!-- 树的可视化 -->
        <div class="tree-container">
            <div class="tree-trunk">
                <div class="tree-leaves" id="treeLeaves">
                    <!-- 叶子将动态生成 -->
                </div>
            </div>
            <p class="leaf-count">树叶数量: <span id="leafCount">0</span> / 999</p>
        </div>

        <!-- 输入区域 -->
        <div class="input-section">
            <textarea class="treehole-input" placeholder="把你的心事说给树洞听..." id="treeholeInput"></textarea>
            <button class="btn btn-primary btn-full" onclick="sendToTreehole()">投入树洞</button>
        </div>

        <!-- 历史树叶按钮 -->
        <div class="history-section">
            <button class="history-btn" onclick="toggleHistory()">
                📜 历史树叶
            </button>
        </div>

        <!-- 历史消息列表 -->
        <div class="history-list" id="historyList" style="display: none;">
            <!-- 历史消息将动态生成 -->
        </div>
    </main>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
        <div class="nav-item" onclick="redirectToIndex()">
            <span class="nav-icon">🏠</span>
            <span class="nav-text">首页</span>
        </div>
        <div class="nav-item" onclick="redirectToMatch()">
            <span class="nav-icon">🤝</span>
            <span class="nav-text">契约匹配</span>
        </div>
        <div class="nav-item" onclick="redirectToGarden()">
            <span class="nav-icon">🌻</span>
            <span class="nav-text">情绪花园</span>
        </div>
        <div class="nav-item active" onclick="redirectToTreehole()">
            <span class="nav-icon">🌳</span>
            <span class="nav-text">树洞倾诉</span>
        </div>
        <div class="nav-item" onclick="redirectToProfile()">
            <span class="nav-icon">👤</span>
            <span class="nav-text">我的</span>
        </div>
    </nav>

    <script src="js/treehole.js"></script>
</body>
</html>
