﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星树 - 搜索</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/search.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="top-nav">
        <div class="nav-container">
            <button class="back-btn" onclick="goBack()">← 返回</button>
            <div class="search-container">
                <input type="text" class="search-input" placeholder="搜索心情、标签或用户" id="searchInput" onkeyup="handleSearch()">
                <button class="search-btn" onclick="handleSearch()">🔍</button>
            </div>
            <span class="nav-placeholder"></span>
        </div>
    </header>

    <!-- 搜索结果 -->
    <main class="main-content">
        <div class="search-results" id="searchResults">
            <!-- 搜索结果将动态生成 -->
        </div>
    </main>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
        <div class="nav-item" onclick="redirectToIndex()">
            <span class="nav-icon">🏠</span>
            <span class="nav-text">首页</span>
        </div>
        <div class="nav-item" onclick="redirectToMatch()">
            <span class="nav-icon">🤝</span>
            <span class="nav-text">契约匹配</span>
        </div>
        <div class="nav-item" onclick="redirectToGarden()">
            <span class="nav-icon">🌻</span>
            <span class="nav-text">情绪花园</span>
        </div>
        <div class="nav-item" onclick="redirectToTreehole()">
            <span class="nav-icon">🌳</span>
            <span class="nav-text">树洞倾诉</span>
        </div>
        <div class="nav-item" onclick="redirectToProfile()">
            <span class="nav-icon">👤</span>
            <span class="nav-text">我的</span>
        </div>
    </nav>

    <script src="js/search.js"></script>
</body>
</html>
