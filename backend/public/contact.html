﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星树 - 联系我们</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="top-nav">
        <div class="nav-container">
            <button class="back-btn" onclick="goBack()">← 返回</button>
            <div class="logo">
                <span class="logo-icon">📞</span>
                <span class="logo-text">联系我们</span>
            </div>
            <span class="nav-placeholder"></span>
        </div>
    </header>

    <!-- 联系信息 -->
    <main class="main-content">
        <div class="contact-card">
            <div class="contact-header">
                <span class="header-icon">💬</span>
                <h2>联系我们</h2>
                <p>有任何问题或建议，欢迎随时联系我们</p>
            </div>
            
            <div class="contact-info">
                <div class="info-item">
                    <span class="info-icon">📞</span>
                    <div class="info-content">
                        <span class="info-label">联系电话</span>
                        <span class="info-value">19506146511</span>
                    </div>
                </div>
                
                <div class="info-item">
                    <span class="info-icon">📧</span>
                    <div class="info-content">
                        <span class="info-label">电子邮箱</span>
                        <span class="info-value">2309129591@qq.com</span>
                    </div>
                </div>
                
                <div class="info-item">
                    <span class="info-icon">📍</span>
                    <div class="info-content">
                        <span class="info-label">地址</span>
                        <span class="info-value">山东省青岛市胶州市</span>
                    </div>
                </div>
            </div>
            
            <div class="contact-form">
                <h3>发送消息</h3>
                <textarea class="contact-textarea" placeholder="请输入您的问题或建议..." id="contactMessage"></textarea>
                <button class="btn btn-primary btn-full" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </main>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
        <div class="nav-item" onclick="redirectToIndex()">
            <span class="nav-icon">🏠</span>
            <span class="nav-text">首页</span>
        </div>
        <div class="nav-item" onclick="redirectToMatch()">
            <span class="nav-icon">🤝</span>
            <span class="nav-text">契约匹配</span>
        </div>
        <div class="nav-item" onclick="redirectToGarden()">
            <span class="nav-icon">🌻</span>
            <span class="nav-text">情绪花园</span>
        </div>
        <div class="nav-item" onclick="redirectToTreehole()">
            <span class="nav-icon">🌳</span>
            <span class="nav-text">树洞倾诉</span>
        </div>
        <div class="nav-item" onclick="redirectToProfile()">
            <span class="nav-icon">👤</span>
            <span class="nav-text">我的</span>
        </div>
    </nav>

    <script src="js/contact.js"></script>
</body>
</html>
